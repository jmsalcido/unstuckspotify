name: Release

# Builds a release for macOS, Windows, and Linux whenever a tag is pushed.
# Push a tag like `v1.0.0` and the binaries appear in a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: UnstuckSpotify-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: UnstuckSpotify-macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: UnstuckSpotify-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: UnstuckSpotify-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (GTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libx11-dev libwayland-dev

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/unstuck_spotify" dist/
          cp README.md dist/
          tar -czf "${{ matrix.name }}.tar.gz" -C dist .
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/unstuck_spotify.exe" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.name }}.zip"
          $hash = (Get-FileHash "${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.name }}.zip" | Out-File -Encoding ascii "${{ matrix.name }}.zip.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UnstuckSpotify-macos-arm64.tar.gz
            UnstuckSpotify-macos-intel.tar.gz
            UnstuckSpotify-windows-x64.zip
            UnstuckSpotify-linux-x64.tar.gz
            *.sha256
